<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BriZ BarZ</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      touch-action: none;
    }

    h1 {
      margin: 20px 0 5px;
    }

    #stats {
      font-size: 20px;
      margin: 10px;
    }

    #message {
      min-height: 28px;
      font-size: 18px;
      margin: 10px;
    }

    #board {
      width: 95vw;
      max-width: 500px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .word {
      background: #222;
      border: 2px solid #555;
      border-radius: 10px;
      padding: 20px 3px;
      font-size: 16px;
      font-weight: bold;
      user-select: none;
      touch-action: none;
    }

    .selected {
      background: #8b2cff;
      border-color: white;
      transform: scale(1.05);
    }

    .cleared {
      visibility: hidden;
    }
  </style>
</head>

<body>

  <h1>🎤 BriZ BarZ</h1>

  <div id="stats">
    Combo: <span id="combo">0</span>
    &nbsp; | &nbsp;
    Score: <span id="score">0</span>
  </div>

  <div id="message">
    Touch a word and swipe through rhymes!
  </div>

  <div id="board"></div>

  <script>

    const rhymeFamilies = {
      fire: ["FIRE", "HIGHER", "TIRED", "ENTIRE"],
      cat: ["CAT", "HAT", "BAT"],
      light: ["LIGHT", "NIGHT", "FIGHT", "FLIGHT"],
      blue: ["BLUE", "TRUE", "CREW", "NEW"]
    };

    const words = [
      "FIRE", "HIGHER", "TIRED", "ENTIRE",
      "CAT", "HAT", "BAT", "DOG",
      "LIGHT", "NIGHT", "FIGHT", "FLIGHT",
      "BLUE", "TRUE", "CREW", "NEW"
    ];

    let selected = [];
    let combo = 0;
    let score = 0;
    let swiping = false;

    const board = document.getElementById("board");
    const message = document.getElementById("message");

    function getFamily(word) {

      for (const family in rhymeFamilies) {
        if (rhymeFamilies[family].includes(word)) {
          return family;
        }
      }

      return null;
    }

    function createBoard() {

      board.innerHTML = "";

      words.forEach(word => {

        const tile = document.createElement("div");

        tile.className = "word";
        tile.textContent = word;
        tile.dataset.word = word;

        board.appendChild(tile);

      });
    }

    board.addEventListener("pointerdown", function(event) {

      const tile = event.target.closest(".word");

      if (!tile) return;

      event.preventDefault();

      swiping = true;
      selected = [];

      selectTile(tile);

    });

    board.addEventListener("pointermove", function(event) {

      if (!swiping) return;

      event.preventDefault();

      const element = document.elementFromPoint(
        event.clientX,
        event.clientY
      );

      if (!element) return;

      const tile = element.closest(".word");

      if (tile && board.contains(tile)) {
        selectTile(tile);
      }

    });

    document.addEventListener("pointerup", function() {

      if (!swiping) return;

      swiping = false;

      finishCombo();

    });

    function selectTile(tile) {

      const word = tile.dataset.word;

      if (!word) return;

      if (tile.classList.contains("cleared")) return;

      if (selected.includes(word)) return;

      if (selected.length > 0) {

        const firstFamily =
          getFamily(selected[0]);

        const currentFamily =
          getFamily(word);

        if (
          firstFamily === null ||
          currentFamily === null ||
          firstFamily !== currentFamily
        ) {
          return;
        }
      }

      selected.push(word);

      tile.classList.add("selected");

      message.textContent =
        selected.length + " words connected";

    }

    function finishCombo() {

      if (selected.length < 2) {

        clearSelection();

        message.textContent =
          "Connect 2 or more rhyming words!";

        return;
      }

      const amount = selected.length;

      combo++;

      score += amount * amount * 10;

      document.getElementById("combo").textContent = combo;
      document.getElementById("score").textContent = score;

      if (amount === 2) {

        message.textContent =
          "✅ 2-WORD COMBO!";

      } else if (amount === 3) {

        message.textContent =
          "🔥 3-WORD COMBO!";

      } else if (amount === 4) {

        message.textContent =
          "💣 4-WORD BOMB!";

      } else if (amount === 5) {

        message.textContent =
          "⭐ 5-WORD SUPER COMBO!";

      } else if (amount === 6) {

        message.textContent =
          "💥 6-WORD SYLLABLE BOMB!";

      } else if (amount === 7) {

        message.textContent =
          "🚀 7-WORD MEGA COMBO!";

      } else if (amount >= 8) {

        message.textContent =
          "🌪️ 8-WORD BOARD CHANGE!";

      }

      selected.forEach(word => {

        const tile =
          document.querySelector(
            '.word[data-word="' + word + '"]'
          );

        if (tile) {
          tile.classList.remove("selected");
          tile.classList.add("cleared");
        }

      });

      selected = [];
    }

    function clearSelection() {

      document.querySelectorAll(".selected")
        .forEach(tile => {
          tile.classList.remove("selected");
        });

      selected = [];
    }

    createBoard();

  </script>

</body>
</html>
