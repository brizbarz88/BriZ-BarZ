<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BriZ BarZ</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 20px 0 5px;
    }

    #combo {
      font-size: 22px;
      margin: 10px;
    }

    #message {
      height: 25px;
      font-size: 18px;
      margin: 5px;
    }

    #board {
      width: 95vw;
      max-width: 500px;
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .word {
      background: #222;
      border: 2px solid #555;
      border-radius: 10px;
      padding: 18px 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .selected {
      background: #8b2cff;
      border-color: white;
    }

    .wrong {
      background: #8b2222;
      border-color: white;
    }
  </style>
</head>

<body>

  <h1>🎤 BriZ BarZ</h1>

  <div id="combo">Combo: 0</div>
  <div id="message">Connect 3 rhyming words!</div>

  <div id="board"></div>

  <script>

    const rhymeFamilies = {
      fire: ["FIRE", "HIGHER", "TIRED", "ENTIRE"],
      cat: ["CAT", "HAT", "BAT"],
      light: ["LIGHT", "NIGHT", "FIGHT", "FLIGHT"],
      blue: ["BLUE", "TRUE", "CREW", "NEW"]
    };

    const words = [
      "FIRE", "HIGHER", "TIRED", "ENTIRE",
      "CAT", "HAT", "BAT", "DOG",
      "LIGHT", "NIGHT", "FIGHT", "FLIGHT",
      "BLUE", "TRUE", "CREW", "NEW"
    ];

    let selected = [];
    let combo = 0;

    const board = document.getElementById("board");
    const message = document.getElementById("message");

    function getRhymeFamily(word) {
      for (const family in rhymeFamilies) {
        if (rhymeFamilies[family].includes(word)) {
          return family;
        }
      }

      return null;
    }

    function createBoard() {
      board.innerHTML = "";

      words.forEach(word => {
        const tile = document.createElement("div");

        tile.className = "word";
        tile.textContent = word;

        tile.onclick = () => selectWord(tile, word);

        board.appendChild(tile);
      });
    }

    function selectWord(tile, word) {

      if (selected.includes(word)) return;

      selected.push(word);
      tile.classList.add("selected");

      if (selected.length === 3) {

        const families = selected.map(getRhymeFamily);

        if (
          families[0] !== null &&
          families[0] === families[1] &&
          families[1] === families[2]
        ) {

          combo++;

          document.getElementById("combo").textContent =
            "Combo: " + combo;

          message.textContent = "🔥 RHYME COMBO!";

          setTimeout(() => {

            selected.forEach(w => {

              const tiles =
                document.querySelectorAll(".word");

              tiles.forEach(t => {
                if (t.textContent === w) {
                  t.style.visibility = "hidden";
                }
              });

            });

            selected = [];

          }, 500);

        } else {

          message.textContent =
            "❌ Those words don't rhyme!";

          selected.forEach(w => {

            const tiles =
              document.querySelectorAll(".word");

            tiles.forEach(t => {
              if (t.textContent === w) {
                t.classList.remove("selected");
                t.classList.add("wrong");
              }
            });

          });

          setTimeout(() => {

            document.querySelectorAll(".word")
              .forEach(t => t.classList.remove("wrong"));

            selected = [];

            message.textContent =
              "Connect 3 rhyming words!";

          }, 700);
        }
      }
    }

    createBoard();

  </script>

</body>
</html>
